name: CD Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

jobs:

  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    steps:

      - name: SSH Deploy
        uses: appleboy/ssh-action@v1

      - name: Set tag
        id: vars
        run: echo "TAG=v${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build image
        run: |
          docker build -t shiitake831dev/api-study:${{ steps.vars.outputs.TAG }} .

      - name: Push image
        run: |
          docker push shiitake831dev/api-study:${{ steps.vars.outputs.TAG }}


      - name: Debug HOST
        run: |
          if [ -z "${{ secrets.EC2_HOST }}" ]; then
            echo "HOST is EMPTY"
          else
            echo "HOST is SET"
          fi
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/deploy

            # IMAGE_TAGを書き換え
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${{ steps.vars.outputs.TAG }}/" .env

            docker compose pull
            docker compose up -d

